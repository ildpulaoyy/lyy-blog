<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FDE9D0"/><stop offset="0.55" stop-color="#F7D9C4"/><stop offset="1" stop-color="#EFC7BE"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF6DC"/><stop offset="1" stop-color="#FFE1A8"/>
  </linearGradient>
  <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D9A679"/><stop offset="1" stop-color="#BE8259"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF4D6" stop-opacity="0.95"/><stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="700" fill="url(#sky)"/>
<!-- sun glow outside window -->
<circle cx="1180" cy="230" r="360" fill="url(#glow)"/>
